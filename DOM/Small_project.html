<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 200px;            
        }
        .counter{
            background-color: aqua;
            height: 300px;
            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            flex-direction: column;
            

        }
        .btn{
            height: 30px;
            width: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            background-color:darkgrey;
            margin: 2px;
            
        }
        .dix{
            display: flex;
            flex-direction: row;

        }
    </style>
</head>
<body>
    <div class="counter">  
    <div> <p>Count:<span id="count"></span></p></div>

    <div class="dix">
        <button class="btn">Inc</button>
        <button class="btn">Dec</button>
        <button class="btn">Reset</button></div>
   

    <script>
        let count = 0;
        const countEl = document.getElementById('count');
        const incBtn = document.querySelector('.btn:nth-of-type(1)');
        const decBtn = document.querySelector('.btn:nth-of-type(2)');
        const resetBtn = document.querySelector('.btn:nth-of-type(3)');

        function updateDisplay() {
            countEl.textContent = count;
        }

        incBtn.addEventListener('click', function() {
            count += 1;
            updateDisplay();
        });

        decBtn.addEventListener('click', function() {
            if (count > 0) {
                count -= 1;
                updateDisplay();
            }
        });

        resetBtn.addEventListener('click', function() {
            count = 0;
            updateDisplay();
        });

        updateDisplay();
    </script>
</body>
</html>
