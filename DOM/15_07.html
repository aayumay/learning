<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <input id="passInput" type="password" placeholder="Enter the password">
    <button id="showpass">Show pass</button>

    <script>


        let name = "aayush";

        let revstr = name.split("").reverse().join("");

        console.log(name);
        console.log(revstr);
        
        let passInput = document.getElementById('passInput');
        let showpss = document.getElementById('showpass');

        showpss.onclick = function(){
            if(passInput.type === 'password') {
                passInput.type = 'text';
                showpss.textContent = 'Hide password';
            }else{
                passInput.type = 'password';
                showpss.textContent = 'show password';
            }
        }
    </script>
</body>
</html>
