<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin: 0;
            padding: 0;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            background-color: black;
            color: aliceblue;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;

        }
        #controls{
            margin-bottom: 15px;
            text-align: center;
        }
        button{
            padding: 10px 20px;
            font-size: 16px;
            background-color: antiquewhite;
            color: rgb(5, 5, 5);
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover{
            background-color: rgb(160, 133, 185);
        }
        canvas{
            border: 3px solid white;
            background-color: white;
            border-radius: 5px;
            cursor: crosshair;
            transition: background-color 0.3s ease;
           /* background: hsl(360, 80%, 90%); */
        }
    </style>
</head>
<body>
    <div id="controls">
        <button id="cleanBtn">Clean Board</button>
        <p>TIP: Double click for bg color change | Right click to chang brush color</p>
    </div>

    <canvas id="paintCanvas" width="800px" height="500px"></canvas>

    <script src="script.js"></script>
</body>
</html>
