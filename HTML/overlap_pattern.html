<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stepped Boxes with z-index</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f5f5f5;
    }

    .container{
      position:relative;
      width:500px;
      height:300px;
    }

    .box{
      position:absolute;
      width:120px;
      height:120px;
      border:4px solid black;
    }

    .box1{
      top:0;
      left:0;
      background-color:aqua;
      z-index:1;
    }

    .box2{
      top:50px;
      left:100px;
      background-color:black;
      z-index:2;
    }

    .box3{
      top:100px;
      left:200px;
      background-color:blueviolet;
      z-index:3;
    }

    .box4{
      top:150px;
      left:300px;
      background-color:blanchedalmond;
      z-index:4;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
  </div>

</body>
</html>
