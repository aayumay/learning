<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pattern</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#6cbfd9;
      font-family:sans-serif;
    }

    .wrapper{
      width:550px;
      height:300px;
      border:4px solid #070707;
      padding:20px;
      display:flex;
      flex-direction:column;
      gap:18px;
      background:rgb(51, 75, 196);
    }
    .top{
      height: 80px;
      display:flex;
      flex-direction:row;
      gap: 18px;
    }
    .box{
      flex:1;
      border:4px solid #222;
      background:#b83987;
    }
    .middle{
      height: 80px;
      border:4px solid #222;
      background:#f5f5f5;
      display:flex;
      justify-content:space-evenly;
      align-items:center;
    }
    .circle{
      width: 50px;
      height: 50px;
      border:4px solid #222;
      border-radius: 50%;
      background: white;
    }
    .rect{
      width: 80px;
      height: 50px;
      border:4px solid #222;
      background: white;
    }
    .bottom{
      height: 60px;
      border:4px solid #222;
      background:#f5f5f5;
      display:flex;
    }
    .door{
      flex: 1;
      display:flex;
    }
    .panel{
      flex: 1;
    }

  </style>
</head>
<body>

  <div class="wrapper">

    <div class="top">
      <div class="box"></div>
      <div class="box"></div>
    </div>

    <div class="middle">
      <div class="circle"></div>
      <div class="rect"></div>
      <div class="circle"></div>
      <div class="rect"></div>
    </div>

    <div class="bottom">
      <div class="door">
        <div class="panel"></div>
        <div class="panel"></div>
      </div>
    </div>

  </div>

</body>
</html>
