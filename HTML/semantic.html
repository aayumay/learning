<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
    <style>
        .head{
            /* display: inline-block; */
            height: 100px;
            width: 600px;
            margin: 2px;
            background-color: rgb(234, 120, 120);
            border: 2px solid black;
        }
        .yellow{
            height: 80px;
            width: 600px;
            margin: 2px;
            background-color: rgb(240, 206, 119);
            border: 2px solid black;
        }
        .main{
            height: 400px;
            width: 350px;
            display: inline-block;
            background-color: rgb(98, 186, 237);
            border: 2px solid black;
        }
        .left{
            height: 380px;
            display: inline-block;
            margin: 9px;
            width: 150px;
            background-color: rgb(139, 226, 239);
            border: 2px solid black;
        }
        .right{
            height: 380px;
            display: inline-block;
            width: 150px;
            margin: 9px;
            background-color:rgb(157, 157, 243);
            border: 2px solid black;
        }
        .rightt{
            height: 399px;
            display: inline-block;
            width: 240px;
            margin: 2px;
            background-color: rgb(170, 235, 170);
            border: 2px solid black;
        }
        .bottom{
            height: 80px;
            width: 600px;
            margin: 2px;
            background-color: #ea7e7e;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="head"></div>
    <div class="yellow"></div>
    <div class="main">
        <div class="left"></div>
        <div class="right"></div>
    </div>
    <div class="rightt"></div>
    <div class="bottom"></div>
</body>
</html>
