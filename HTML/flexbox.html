<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flexbox Layout</title>

<style>
    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        display:flex;
        justify-content:space-around;
        align-items:flex-start;
        padding:40px;
    }

    .container{
        width:400px;
        height:300px;
        border:1px solid black;
        display:flex;
        gap:10px;
        padding:15px;
    }

    .left{
        justify-content:flex-start;
    }

    .right{
        justify-content:flex-end;
    }

    .box{
        width:80px;
        height:60px;
        border:1px solid black;
        background-color: rgb(98, 156, 136);
    }
</style>
</head>

<body>

    <div class="container left">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

    <div class="container right">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>

</body>
</html>
