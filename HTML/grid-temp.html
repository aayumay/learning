<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: grid;
            grid-template-columns: 200px 1fr 200px;
            grid-template-rows: 80px 1fr 60px;
            grid-template-areas: "header header header"
                                "sidebar main aside"
                                "footer footer footer";
            gap: 10px;
            height: 100vh;
            border: 2px solid;
            
        }

        .header{
            grid-area: header;
            border: 2px solid;
            background-color: rgb(175, 230, 230);
            
            
        }
        .sidebar{
            grid-area: sidebar;
            border: 2px solid;
        }
        .main{
            grid-area: main;
            border: 2px solid;
        }
        .aside{
            grid-area: aside;
            border: 2px solid;
        }
        .footer{
            grid-area: footer; 
            border: 2px solid;
            
        }
    </style>
</head>
<body>
    <div class="container">
    <div class="header"></div>
    <div class="sidebar"></div>
    <div class="main"></div>
    <div class="aside"></div>
    <div class="footer"></div>
    </div>
</body>
</html>
