<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .head{
            background-color: rgb(233, 242, 242);
            height:60px;
            position: fixed;
        }
        .logo{
            height: 20px;
            padding: 10px;
            width: 100px;
            margin: 9px;
            background-color: rgb(244, 244, 153);
            border-radius: 5px;
            display: inline-block;
            text-align: center;
        }
        .travel{
            display:inline-block;
            height: 20px;
            width: 100px;
            margin: 2px;
            background-color: rgb(221, 221, 215);
            border-radius: 5px;
            text-align: center;
            padding: 10px
        }

        .location{
            display: inline-block;
            padding: 10px;
            background-color: rgb(255, 255, 255);
            height: 20px;
            width: 300px;
            margin-left: 55%;
            border:1px solid;
            border-radius: 5px;
            text-align: center;

        }
        .searchbox{
            padding: 10px;
            background-color: beige;
            margin-top:10px;
            border-radius: 2px;
            border: 2px solid;
            width: 65% ;
            display: inline-block;
        }
        .login{
           padding: 10px;
           background-color: rgb(77, 150, 150);
           width: 60px;
           height: 20px;
           display: inline-block;
           margin-left: 20px;

        }
        
        .more{
            padding: 10px;
            display: inline-block;
            width: 60px;
            height: 20px;
            background-color: rgb(77, 150, 150);
            margin-left: 20px;
        }
       

    </style>
</head>
<body>
    <header class="head">
        <div class="logo">Flipkart</div>
        <div class="travel">Travel</div>
        <div class="location">location</div>
    </header>
    <div>
    <div class="searchbox">Search</div>
    <div class="login">login</div>
    <div class="more">more</div>
    <div class="more">cart</div>
    
    
    </div>
</body>
</html>
