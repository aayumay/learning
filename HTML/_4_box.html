<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stepped Boxes with z-index</title>

  <style>
    body{
      margin:0;
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f5f5f5;
    }

    .container{
      position:relative;
      width:500px;
      height:250px;
    }

    .box{
      position:absolute;
      width:120px;
      height:120px;
      border:2px solid black;
    }

    .box1{
      top:0;
      left:0;
      background-color:rgb(94, 168, 238);
      z-index:2;
    }

    .box2{
      top:-80px;
      left:100px;
      background-color:rgb(216, 226, 74);
      z-index:4;
    }

    .box3{
      top:0px;
      left:200px;
      background-color:rgb(158, 90, 222);
      z-index:2;
    }

    .box4{
      top:80px;
      left:100px;
      background-color:rgb(233, 138, 114);
      z-index:1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="box box4"></div>
    <div class="box box3"></div>
    <div class="box box2"></div>
    <div class="box box1"></div>
  </div>

</body>
</html>
