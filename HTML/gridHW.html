<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grid Demo</title>

<style>
.container {
    width: 600px;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: 80px 80px 80px;
    gap: 5px;
}

.a {
    background: royalblue;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    grid-column: 1 / 3;
}

.b {
    background: orange;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    grid-column: 1 / 3;
}

.c {
    background: mediumorchid;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    grid-column: 3 / 4;
    grid-row: 1 / 3;
}

.d {
    background: turquoise;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    grid-column: 4 / 5;
    grid-row: 1 / 2;
}

.e {
    background: lightgray;
    display: flex;
    justify-content: center;
    align-items: center;
    grid-column: 4 / 5;
    grid-row: 2 / 3;
}

.f {
    background: deepskyblue;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    grid-column: 1 / 5;
}
</style>
</head>
<body>

<div class="container">
    <div class="a">A</div>
    <div class="c">C</div>
    <div class="d">D</div>
    <div class="b">B</div>
    <div class="e">E</div>
    <div class="f">F</div>
</div>

</body>
</html>
