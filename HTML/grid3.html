</html><!DOCTYPE html>
<html>
<head>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

.container{
    width:800px;
    margin:30px auto;
    padding:20px;
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap:20px;
    border:2px solid black;
    background-color: rgb(152, 144, 134);
}

.box{
    border:2px solid black;
    min-height:100px;
    
}


.box1{
    grid-column:1 / 3;
    background-color: aquamarine;
}

.box2{
    grid-column:3 / 5;
    background-color: blanchedalmond;
}

.box3{
    grid-column:5 / 7;
    background-color: rgb(166, 122, 208);
}


.box4{
    grid-column:1 / 7;
    background-color: cadetblue;
}

.box5{
    grid-column:1 / 3;
    background-color: rgb(201, 233, 169);
}

.box6{
    grid-column:3 / 7;
    background-color: rgb(223, 154, 104);
}
</style>
</head>

<body>

<div class="container">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>

    <div class="box box4"></div>

    <div class="box box5"></div>
    <div class="box box6"></div>
</div>

</body>
</html>
