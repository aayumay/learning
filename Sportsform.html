<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Sports Physical Form</h1>
    <form action="">
        <fieldset>
            <legend>Athlete Information</legend>
            <ul>
                <li>
                    <label for="fullName" >Name:</label>
                    <input  type="text" id="fullName" name="fullName" placeholder="Enter your full name">
                </li>
                <li>
                    <label for="schoolTeam" >School/Team:</label>
                    <input  type="text" id="schoolTeam" name="schoolTeam" placeholder="School Name">
                </li>
                <li>
                    <label for="sportsName" >Sports:</label>
                    <input  type="text" id="sportsName" name="sportsName" placeholder="Enter your sports name">
                </li>
                <li>
                    <label for="parentGuardian" >Parent/Guardian:</label>
                    <input  type="text" id="parentGuardian" name="parentGuardian" placeholder="Enter your Parents name">
                </li>
                <li>
                    <label for="contactNumber" >Contact number:</label>
                    <input  type="text" id="contactNumber" name="contactNumber" placeholder="Enter your Contact number">
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>Medical History for Athlete</legend>
                <ul>
                <li>
                    <label for="concussions" >History of concussions:</label>
                    <input  type="radio" id="concussionsYes" name="concussionsQ" value="yes">
                    Yes
                    <input  type="radio" id="concussionsNo" name="concussionsQ" value="no">
                    No
                </li>
                <li>
                    <label for="previousSurgeries" >Previous surgeries:</label>
                    <input  type="radio" id="surgeriesYes" name="previousSurgeriesQ" value="yes">
                    Yes
                    <input  type="radio" id="surgeriesNo" name="previousSurgeriesQ" value="no">
                    No
                </li>
                <li>
                    <label for="boneFractureDetails" >Any bone fracture?</label>
                    <input  type="text" id="boneFractureDetails" name="boneFractureDetails" placeholder="">
                </li>
                <li>
                    <label for="asthmaProblems" >Asthma or breathing problems:</label>
                    <input  type="radio" id="asthmaYes" name="asthmaProblemsQ" value="yes">
                    Yes
                    <input  type="radio" id="asthmaNo" name="asthmaProblemsQ" value="no">
                    No
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>Fitness Assessment</legend>
            <table>
                <tr>
                    <th>category</th>
                    <th>Pass</th>
                    <th>Fail</th>
                </tr>
                <tr>
                    <th>Cardiovascular</th>
                    <td>[]</td>
                    <td>[]</td>
                    
                </tr>
                <tr>
                    <th>Flexibility</th>
                    <td>[]</td>
                    <td>[]</td>
                    
            
                </tr>
                <tr>
                    <th>Strength</th>
                    <td>[]</td>
                    <td>[]</td>
                    
                </tr>
                <tr>
                    <th>Endurance</th>
                    <td>[]</td>
                    <td>[]</td>
                    
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
